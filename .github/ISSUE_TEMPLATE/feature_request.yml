name: Feature request
description: Suggest an addition or change to the container's API.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API
      description: Show how you would like to write it.
      render: ts
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including how other containers handle it, if relevant.
