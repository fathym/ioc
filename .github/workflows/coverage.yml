name: Coverage

# Runs the test suite with coverage, publishes the table for src/ to the job summary, and fails
# when line or branch coverage drops below the floors in scripts/coverage.ts.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run the tests with coverage and check the floors
        run: deno task coverage
